<!doctype html>
<html lang="en" data-theme="green">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#dfeadf" />
  <title>Deadline Garden</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="petalRain" class="petal-rain" aria-hidden="true"></div>

  <div id="warningBackdrop" class="warning-backdrop" aria-hidden="true">
    <div class="warning-copy">
      <div id="warningKicker" class="warning-kicker"></div>
      <div id="warningText" class="warning-text"></div>
    </div>
  </div>

  <div class="garden-frame">
    <header class="topbar">
      <div class="brand-row">
        <div class="theme-wrap">
          <button id="themeBtn" class="theme-btn" aria-label="Change color theme" title="Change theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.2 3.4 10.5 5h3L15.8 3.4l4 2.1-2.1 4v10.3H6.3V9.5l-2.1-4 4-2.1Z"/>
              <path d="M9.1 4.3c.4 1.5 1.4 2.3 2.9 2.3s2.5-.8 2.9-2.3"/>
            </svg>
          </button>
          <div id="themeMenu" class="theme-menu hidden wardrobe-menu" role="menu" aria-label="Customize Deadline Garden">
            <div class="wardrobe-title">Wardrobe</div>
            <div class="wardrobe-section"><div class="theme-menu-title">Garden color</div><div class="theme-swatches">
              <button class="theme-swatch red" data-theme-choice="red"></button><button class="theme-swatch orange" data-theme-choice="orange"></button><button class="theme-swatch yellow" data-theme-choice="yellow"></button><button class="theme-swatch green" data-theme-choice="green"></button><button class="theme-swatch blue" data-theme-choice="blue"></button><button class="theme-swatch indigo" data-theme-choice="indigo"></button><button class="theme-swatch purple" data-theme-choice="purple"></button>
            </div></div>
            <div class="wardrobe-section"><div class="theme-menu-title">Flowers · size</div><div class="mini-options"><button data-customize-key="flowerSize" data-customize-value="small">Small</button><button data-customize-key="flowerSize" data-customize-value="medium">Medium</button><button data-customize-key="flowerSize" data-customize-value="large">Large</button></div></div>
            <div class="wardrobe-section"><div class="theme-menu-title">Flowers · opacity</div><div class="mini-options"><button data-customize-key="flowerOpacity" data-customize-value="low">Low</button><button data-customize-key="flowerOpacity" data-customize-value="medium">Medium</button><button data-customize-key="flowerOpacity" data-customize-value="high">High</button></div></div>
            <div class="wardrobe-section"><div class="theme-menu-title">Confetti</div><div class="mini-options"><button data-customize-key="confetti" data-customize-value="low">Low</button><button data-customize-key="confetti" data-customize-value="medium">Medium</button><button data-customize-key="confetti" data-customize-value="high">High</button></div></div>
            <div class="wardrobe-section"><div class="theme-menu-title">Checklist color</div><div class="mini-options"><button data-customize-key="checklistColor" data-customize-value="postit">Post-it</button><button data-customize-key="checklistColor" data-customize-value="white">White</button><button data-customize-key="checklistColor" data-customize-value="theme">Theme</button></div></div>
            <div class="wardrobe-section"><div class="theme-menu-title">Checklist shape</div><div class="mini-options wrap"><button data-customize-key="checklistShape" data-customize-value="postit">Post-it</button><button data-customize-key="checklistShape" data-customize-value="portrait">Tall</button><button data-customize-key="checklistShape" data-customize-value="landscape">Wide</button><button data-customize-key="checklistShape" data-customize-value="circle">Circle</button></div></div>
          </div>
        </div>
        <div>
          <div class="eyebrow">DEADLINE GARDEN</div>
          <h1 id="todayHeading">Today</h1>
          <div id="summaryLine" class="summary-line">0 tasks remaining</div>
        </div>
      </div>

      <div class="top-actions">
        <button id="importBtn" class="soft-btn">Batch Paste</button>
        <button id="addBtn" class="primary-btn">+ Add task</button>
        <button id="todoToggle" class="todo-pill">Todo <span id="todoCount">0</span></button>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero-card glass">
        <div class="section-label">NEXT DEADLINE</div>
        <div id="nextTitle" class="next-title">Nothing due soon</div>
        <div id="nextMeta" class="next-meta">Your calendar is clear.</div>
        <div id="nextCountdown" class="next-countdown"></div>
      </section>

      <section class="calendar-card glass">
        <div class="calendar-toolbar">
          <div class="month-nav">
            <button id="prevMonth" class="icon-btn" aria-label="Previous month">‹</button>
            <h2 id="monthLabel"></h2>
            <button id="nextMonth" class="icon-btn" aria-label="Next month">›</button>
          </div>
          <div class="calendar-tools">
            <button id="holidayBtn" class="soft-btn small holiday-toolbar-btn">+ Holiday</button>
            <div class="view-switch" aria-label="Calendar view">
              <button data-cal-view="month" class="view-btn active">Month</button>
              <button data-cal-view="week" class="view-btn">Week</button>
              <button data-cal-view="day" class="view-btn">Day</button>
            </div>
            <div class="calendar-tool-right">
              <button id="displayBtn" class="soft-btn small">Display</button>
              <button id="todayBtn" class="soft-btn small">Today</button>
            </div>
          </div>
        </div>
        <div class="weekday-row">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>
    </main>
  </div>

  <aside id="todoPanel" class="todo-panel glass" aria-hidden="true">
    <div class="todo-header">
      <div>
        <div class="section-label">TO DO</div>
        <div id="todoSubtitle" class="todo-subtitle">Nothing pending</div>
      </div>
      <button id="closeTodo" class="icon-btn" aria-label="Close to-do list">×</button>
    </div>
    <div class="todo-badge-control">
      <span>Todo badge shows</span>
      <label><input type="radio" name="todoBadge" data-todo-badge value="today"> Today</label>
      <label><input type="radio" name="todoBadge" data-todo-badge value="week"> This week</label>
      <label><input type="radio" name="todoBadge" data-todo-badge value="all"> All</label>
    </div>
    <div id="todoList" class="todo-list"></div>
  </aside>

  <aside class="quick-note" aria-label="Quick to-do note">
    <div class="quick-note-pin"></div>
    <div class="quick-note-header">
      <div><span>CHECKLIST</span><strong>Checklist <span id="quickTodoCount" class="quick-count inline">0</span></strong></div>
      <div class="quick-header-actions"><button id="quickCollapse" class="quick-collapse" aria-label="Collapse checklist">−</button></div>
    </div>
    <div class="quick-add-row">
      <input id="quickTodoInput" type="text" maxlength="160" placeholder="e.g. Tidy the room" aria-label="New quick to-do">
      <button id="quickTodoAdd" aria-label="Add quick to-do">+</button>
    </div>
    <div id="quickTodoList" class="quick-todo-list"></div>
  </aside>
  <button id="quickBubble" class="quick-bubble hidden" aria-label="Open checklist"><span class="quick-bubble-ring">CHECKLIST • CHECKLIST •</span><span class="quick-bubble-face">☺</span></button>

  <div id="modalRoot" class="modal-root hidden" role="dialog" aria-modal="true">
    <div id="modalCard" class="modal-card glass"></div>
  </div>

  <div id="toast" class="toast"></div>
  <canvas id="confettiCanvas"></canvas>
  <script src="app.js"></script>
</body>
</html>
